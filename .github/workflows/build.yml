name: Build & Release

on:
  push:
    branches: [main, ci/**]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release (tag v<package.json version> on this commit and publish the installer)"
        type: boolean
        default: false
      update_notes:
        description: "Only (re)write the title and notes of the existing release for the package.json version (no build)"
        type: boolean
        default: false

# Read-only by default. Only the release job below asks for more.
permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Runs everything that executes third-party code (npm packages, build tools,
  # the app itself). It has a read-only token and keeps no git credentials on
  # disk, so nothing in here can change the repository or publish anything.
  build:
    name: Build and test
    if: ${{ !inputs.update_notes }}
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Determine version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::package.json version '$VERSION' is not a valid release version"
            exit 1
          fi
          TAG="v$VERSION"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$IS_RELEASE" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Releases are published from $DEFAULT_BRANCH only (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2> tag-check.log; then
              echo "::error::Tag $TAG already exists. Bump the version in package.json first."
              exit 1
            elif ! grep -q "HTTP 404" tag-check.log; then
              cat tag-check.log
              echo "::error::Could not check whether tag $TAG already exists."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npx playwright test

      - name: Package Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Check the packaged app
        run: npm run smoke:packaged

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LargeFileBuster-win-x64
          path: |
            bin/LargeFileBuster-Setup-*.exe
            bin/LargeFileBuster-Setup-*.exe.blockmap
            bin/latest.yml
          if-no-files-found: error
          retention-days: 30

  # The only job with write access. It installs nothing from npm and runs none
  # of the build tooling: it takes the installer built above and publishes it
  # with the GitHub CLI (.github/scripts/publish-release.sh).
  release:
    name: Publish release
    needs: build
    if: ${{ always() && (inputs.update_notes || (needs.build.result == 'success' && needs.build.outputs.is_release == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download installer
        if: ${{ !inputs.update_notes }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LargeFileBuster-win-x64
          path: bin

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_NOTES: ${{ inputs.update_notes }}
        run: bash .github/scripts/publish-release.sh
