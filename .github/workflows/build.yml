name: Build & Release

on:
  push:
    branches: [main, ci/**]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release (tag v<package.json version> on this commit and publish the installer)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$IS_RELEASE" == "true" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "::error::Tag $TAG already exists. Bump the version in package.json first."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npx playwright test

      - name: Create release tag (manual release)
        if: github.event_name == 'workflow_dispatch' && env.IS_RELEASE == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Package Windows installer and publish release
        if: env.IS_RELEASE == 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows installer
        if: env.IS_RELEASE != 'true'
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer artifacts
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LargeFileBuster-win-x64
          path: |
            bin/*.exe
            bin/*.blockmap
            bin/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Check for release notes file
        id: notes
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          FILE="docs/release-notes/${{ steps.version.outputs.tag }}.md"
          if [[ -f "$FILE" ]]; then echo "body_path=$FILE" >> "$GITHUB_OUTPUT"; fi

      - name: Update release notes
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LargeFileBuster ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
