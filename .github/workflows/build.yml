name: Build & Release

on:
  push:
    branches: [main, ci/**]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release (tag v<package.json version> on this commit and publish the installer)"
        type: boolean
        default: false
      update_notes:
        description: "Only (re)write the title and notes of the existing release for the package.json version (no build)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.update_notes }}
    runs-on: windows-latest
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$IS_RELEASE" == "true" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "::error::Tag $TAG already exists. Bump the version in package.json first."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npx playwright test

      - name: Create release tag (manual release)
        if: github.event_name == 'workflow_dispatch' && env.IS_RELEASE == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Package Windows installer and publish release
        if: env.IS_RELEASE == 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows installer
        if: env.IS_RELEASE != 'true'
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer artifacts
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LargeFileBuster-win-x64
          path: |
            bin/*.exe
            bin/*.blockmap
            bin/latest.yml
          if-no-files-found: error
          retention-days: 30

  release-notes:
    needs: build
    if: ${{ always() && (inputs.update_notes || (needs.build.result == 'success' && needs.build.outputs.is_release == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write release title and notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          FILE="docs/release-notes/$TAG.md"
          : > notes.md
          if [[ -f "$FILE" ]]; then
            cat "$FILE" >> notes.md
            printf '\n\n---\n\n' >> notes.md
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "LargeFileBuster $TAG" --notes-file notes.md --draft=false --latest
